<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفاء الذهب | Safaa El Dahab - للعطور الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa820a;
            --light-gold: #f3e5ab;
            --bg-black: #0b0b0b;
            --card-black: #141414;
            --border-color: #33270a;
            --text-white: #f5f5f5;
            --text-gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #000 0%, #1a1505 100%);
            border-bottom: 2px solid var(--primary-gold);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .logo-area h1 {
            color: var(--primary-gold);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .logo-area p {
            color: var(--text-gray);
            font-size: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
            width: 260px;
        }

        .search-container input {
            width: 100%;
            padding: 10px 20px 10px 45px;
            background-color: #1a1a1a;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-white);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .search-container i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-gold);
            font-size: 16px;
        }

        .btn-reviews-nav {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--light-gold);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reviews-nav:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            color: var(--primary-gold);
            font-size: 24px;
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* معرض الكروت */
        .perfumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .perfume-card {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
            border-color: var(--primary-gold);
        }

        .perfume-img-box {
            width: 100%;
            height: 280px;
            background-color: #050505;
            overflow: hidden;
        }

        /* التعديل المضاف لإظهار الصور بكامل جودتها وأبعادها بدون قص */
        .perfume-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #050505;
            image-rendering: -webkit-optimize-contrast;
            transition: transform 0.5s ease;
        }

        .perfume-card:hover .perfume-img-box img {
            transform: scale(1.05);
        }

        .perfume-info {
            padding: 15px;
            text-align: center;
        }

        .perfume-info h3 {
            color: var(--light-gold);
            font-size: 16px;
        }

        /* قسم التقييمات للزوار */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .review-card {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .review-card h4 {
            color: var(--primary-gold);
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-card p {
            color: var(--text-white);
            font-size: 14px;
            line-height: 1.6;
        }

        .review-stars {
            color: #ffc107;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .public-review-box {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .public-review-box h3 {
            color: var(--light-gold);
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* لوحة تحكم المشرفين */
        #admin-panel {
            display: none;
            background: #111;
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .admin-header h2 {
            color: var(--primary-gold);
            font-size: 22px;
        }

        .close-admin {
            background: #331111;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            padding: 6px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-admin:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--light-gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn-gold:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #050505;
            color: var(--text-gray);
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <div class="logo-area">
                <h1>صفاء الذهب</h1>
                <p>Safaa El Dahab Perfumes</p>
            </div>
        </div>
        <div class="header-left">
            <button class="btn-reviews-nav" onclick="scrollToReviews()"><i class="fa-solid fa-star"></i> التقييمات</button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="">
                <i class="fa-solid fa-search"></i>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- لوحة تحكم المشرفين -->
        <div id="admin-panel">
            <div class="admin-header">
                <h2><i class="fa-solid fa-lock"></i> لوحة تحكم المشرفين - صفاء الذهب</h2>
                <button class="close-admin" onclick="closeAdminPanel()">إغلاق اللوحة</button>
            </div>
            <p style="color:var(--light-gold);">الصور مدمجة ومحفوظة حالياً في الكود الأساسي للموقع للجميع.</p>
        </div>

        <!-- معرض الكروت وصور العطور الفاخرة -->
        <section>
            <h2 class="section-title"><i class="fa-solid fa-gem"></i> تشكيلة الكروت والعطور الملكية</h2>
            <div class="perfumes-grid" id="perfumesGrid"></div>
        </section>

        <!-- قسم آراء وتقييمات العملاء -->
        <section id="reviewsSection">
            <h2 class="section-title"><i class="fa-solid fa-comments"></i> آراء وتقييمات العملاء المميزين</h2>
            <div class="reviews-grid" id="reviewsGrid"></div>

            <div class="public-review-box">
                <form id="publicReviewForm" onsubmit="savePublicReview(event)">
                    <h3><i class="fa-solid fa-pen-nib"></i> أضف رأيك أو تقييمك للموقع</h3>
                    <div class="form-group">
                        <label>اسم الشخص:</label>
                        <input type="text" id="publicReviewName" placeholder="اكتب اسمك هنا..." required>
                    </div>
                    <div class="form-group">
                        <label>الرأي أو التعليق:</label>
                        <textarea id="publicReviewText" rows="3" placeholder="اكتب رأيك في العطور أو الخدمة..." required></textarea>
                    </div>
                    <button type="submit" class="btn-gold"><i class="fa-solid fa-paper-plane"></i> إرسال ونشر التقييم فوراً</button>
                </form>
            </div>
        </section>

    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 - براند عطور صفاء الذهب (Safaa El Dahab)
    </footer>

    <script>
        // قائمة الصور الـ 10 بروابط المباشرة الثابتة
        const perfumes = [
            { img: "https://i.ibb.co/d4Qgg1Rd/1.jpg" },
            { img: "https://i.ibb.co/qYqrmTPP/2.jpg" },
            { img: "https://i.ibb.co/ksBwN9CT/3.jpg" },
            { img: "https://i.ibb.co/3YR6LZKB/4.jpg" },
            { img: "https://i.ibb.co/fd5Xfnwx/5.jpg" },
            { img: "https://i.ibb.co/5xhHZN0y/6.jpg" },
            { img: "https://i.ibb.co/mCF7947B/7.jpg" },
            { img: "https://i.ibb.co/35ZzDZ0B/8.jpg" },
            { img: "https://i.ibb.co/QhS28Pj/9.jpg" },
            { img: "https://i.ibb.co/39LywzMT/10.jpg" }
        ];

        let reviews = [];
        try {
            reviews = JSON.parse(localStorage.getItem('safaa_reviews')) || [];
        } catch (e) {
            reviews = [];
        }

        function scrollToReviews() {
            document.getElementById('reviewsSection').scrollIntoView({ behavior: 'smooth' });
        }

        function renderPerfumes() {
            const grid = document.getElementById('perfumesGrid');
            grid.innerHTML = '';

            perfumes.forEach((p) => {
                grid.innerHTML += `
                    <div class="perfume-card">
                        <div class="perfume-img-box">
                            <img src="${p.img}" alt="عطر صفاء الذهب" onerror="this.src='https://via.placeholder.com/300x300?text=صفاء+الذهب'">
                        </div>
                        <div class="perfume-info">
                            <h3>عطور صفاء الذهب الملكية</h3>
                        </div>
                    </div>
                `;
            });
        }

        function renderReviews() {
            const grid = document.getElementById('reviewsGrid');
            grid.innerHTML = '';
            
            if (reviews.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-gray); grid-column: 1/-1; text-align:center; padding:20px;">لا توجد تقييمات مضافة حتى الآن. كن أول من يضيف رأيه!</p>';
                return;
            }

            reviews.forEach((r) => {
                grid.innerHTML += `
                    <div class="review-card">
                        <div class="review-stars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <h4><i class="fa-solid fa-user-circle"></i> ${escapeHtml(r.name)}</h4>
                        <p>${escapeHtml(r.text)}</p>
                    </div>
                `;
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function savePublicReview(e) {
            e.preventDefault();
            const name = document.getElementById('publicReviewName').value.trim();
            const text = document.getElementById('publicReviewText').value.trim();

            if (name && text) {
                reviews.unshift({ name, text });
                document.getElementById('publicReviewForm').reset();
                try {
                    localStorage.setItem('safaa_reviews', JSON.stringify(reviews));
                } catch(e) {}
                renderReviews();
                alert('شكراً لك! تم نشر تقييمك ورأيك في الموقع بنجاح.');
            }
        }

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            if (e.target.value.trim() === '123456789') {
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                e.target.value = '';
            }
        });

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        renderPerfumes();
        renderReviews();
    </script>
</body>
</html>
