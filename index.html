    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa820a;
            --light-gold: #f3e5ab;
            --bg-black: #0b0b0b;
            --card-black: #141414;
            --border-color: #33270a;
            --text-white: #f5f5f5;
            --text-gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #000 0%, #1a1505 100%);
            border-bottom: 2px solid var(--primary-gold);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo-area h1 {
            color: var(--primary-gold);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .logo-area p {
            color: var(--text-gray);
            font-size: 12px;
        }

        .header-phones {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(212, 175, 55, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .header-phones a {
            color: var(--light-gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }

        .header-phones a:hover {
            color: var(--primary-gold);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-nav {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--light-gold);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            color: var(--primary-gold);
            font-size: 22px;
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .perfumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .perfume-card {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
            border-color: var(--primary-gold);
        }

        .perfume-img-box {
            width: 100%;
            height: 280px;
            background-color: #050505;
            overflow: hidden;
        }

        .perfume-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .perfume-card:hover .perfume-img-box img {
            transform: scale(1.05);
        }

        .perfume-info {
            padding: 15px;
            text-align: center;
        }

        .perfume-info h3 {
            color: var(--light-gold);
            font-size: 15px;
        }

        .perfume-price {
            color: var(--primary-gold);
            font-weight: bold;
            font-size: 15px;
            margin-top: 6px;
        }

        .btn-delete-item {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(220, 53, 69, 0.85);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }

        .btn-delete-item:hover {
            background: #dc3545;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .review-card {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .review-card h4 {
            color: var(--primary-gold);
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-card p {
            color: var(--text-white);
            font-size: 14px;
            line-height: 1.6;
        }

        .review-stars {
            color: #ffc107;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .public-review-box {
            background-color: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 50px;
        }

        .public-review-box h3 {
            color: var(--light-gold);
            margin-bottom: 15px;
            font-size: 17px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #141414;
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }

        #admin-panel {
            display: none;
            background: #111;
            border: 2px solid var(--primary-gold);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--light-gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            width: 100%;
        }

        .btn-gold:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            background: #050505;
            color: var(--text-gray);
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
            font-size: 13px;
        }

        .footer-phones {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-phones a {
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

            </div>

            <form id="addPerfumeForm" onsubmit="addNewPerfume(event)" style="margin-bottom: 25px;">

                    <label>اسم العطر:</label>
                    <input type="text" id="adminPerfumeTitle" placeholder="مثال: عطر عود ريشة الملكي" required>
                </div>
                <div class="form-group">
                    <label>رابط صورة العطر (URL):</label>
                    <input type="url" id="adminPerfumeImg" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>السعر:</label>
                    <input type="text" id="adminPerfumePrice" placeholder="مثال: 450 ج.م">
                </div>
                <button type="submit" class="btn-gold"><i class="fa-solid fa-cloud-upload-alt"></i> نشر العطر فوراً</button>
            </form>
        </div>

        <!-- معرض العطور -->
        <section>
            <h2 class="section-title"><i class="fa-solid fa-gem"></i> تشكيلة العطور والمنتجات</h2>
            <div class="perfumes-grid" id="perfumesGrid"></div>
        </section>

        <!-- آراء العملاء -->
        <section id="reviewsSection">
            <h2 class="section-title"><i class="fa-solid fa-comments"></i> آراء وتقييمات العملاء</h2>
            <div class="reviews-grid" id="reviewsGrid"></div>

            <div class="public-review-box">
                <form id="publicReviewForm" onsubmit="savePublicReview(event)">
                    <h3><i class="fa-solid fa-pen-nib"></i> أضف رأيك أو تقييمك للموقع</h3>
                    <div class="form-group">
                        <label>اسم الشخص:</label>
                        <input type="text" id="publicReviewName" placeholder="اكتب اسمك هنا..." required>
                    </div>
                    <div class="form-group">
                        <label>الرأي أو التعليق:</label>
                        <textarea id="publicReviewText" rows="3" placeholder="اكتب رأيك..." required></textarea>
                    </div>
                    <button type="submit" class="btn-gold" style="width: auto;"><i class="fa-solid fa-paper-plane"></i> إرسال التقييم</button>
                </form>
            </div>
        </section>

    </div>

    <!-- نافذة تسجيل دخول المشرف -->

                <span onclick="closeLoginModal()" style="color:#fff; cursor:pointer; font-weight:bold; font-size: 20px;">&times;</span>
            </div>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>أدخل إيميل المشرف:</label>
                    <input type="email" id="loginEmail" placeholder="أدخل إيميل المشرف..." required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="loginPassword" placeholder="******" required>
                </div>
                <button type="submit" class="btn-gold"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
            </form>
        </div>
    </div>

    <footer>

            { title: "عطر صفاء الذهب 40", img: "https://ibb.co/G4sCbyW2", price: "" }
        ];

        auth.onAuthStateChanged((user) => {
            if (user && user.email === ADMIN_EMAIL) {
                isAdminLoggedIn = true;
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('adminLoginBtn').style.display = 'none';
                document.getElementById('adminLogoutBtn').style.display = 'flex';
            } else {
                isAdminLoggedIn = false;
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('adminLoginBtn').style.display = 'flex';
                document.getElementById('adminLogoutBtn').style.display = 'none';
            }
            listenToPerfumes();
        });

        function listenToPerfumes() {
            const grid = document.getElementById('perfumesGrid');
            database.ref('perfumes').on('value', (snapshot) => {
                grid.innerHTML = '';
                const data = snapshot.val();

                let dynamicPerfumes = [];

                if (data) {
                    Object.keys(data).forEach((key) => {
                        dynamicPerfumes.push({
                            id: key,
                            ...data[key]
                        });
                    });
                }

                const allPerfumes = [...dynamicPerfumes, ...defaultPerfumes];

                allPerfumes.forEach((p) => {
                    grid.innerHTML += `
                        <div class="perfume-card">
                            ${(isAdminLoggedIn && p.id) ? `<button class="btn-delete-item" style="display:block;" onclick="deletePerfume('${p.id}')"><i class="fa-solid fa-trash"></i> حذف</button>` : ''}
                            <div class="perfume-img-box">
                                <img src="${p.img}" alt="${escapeHtml(p.title)}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500';">
                            </div>
                            <div class="perfume-info">
                                <h3>${escapeHtml(p.title)}</h3>
                                ${p.price ? `<p class="perfume-price">${escapeHtml(p.price)}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
            });
        }

        function addNewPerfume(e) {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const title = document.getElementById('adminPerfumeTitle').value.trim();
            const img = document.getElementById('adminPerfumeImg').value.trim();
            const price = document.getElementById('adminPerfumePrice').value.trim();

            database.ref('perfumes').push({
                title: title,
                img: img,
                price: price,
                createdAt: Date.now()
            }, (error) => {
                if (error) {
                    alert("حدث خطأ أثناء الإضافة.");
                } else {
                    document.getElementById('addPerfumeForm').reset();
                    alert("تم إضافة العطر بنجاح!");
                }
            });
        }

        function deletePerfume(key) {
            if (confirm("هل أنت متأكد من حذف هذا العطر؟")) {
                database.ref('perfumes').child(key).remove();
            }
        }

        function listenToReviews() {
            const grid = document.getElementById('reviewsGrid');
            database.ref('reviews').on('value', (snapshot) => {
                grid.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    grid.innerHTML = '<p style="color:var(--text-gray); grid-column:1/-1; text-align:center;">لا توجد تقييمات حتى الآن.</p>';
                    return;
                }

                Object.values(data).reverse().forEach((r) => {
                    grid.innerHTML += `
                        <div class="review-card">
                            <div class="review-stars">
                                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                            </div>
                            <h4><i class="fa-solid fa-user-circle"></i> ${escapeHtml(r.name)}</h4>
                            <p>${escapeHtml(r.text)}</p>
                        </div>
                    `;
                });
            });
        }

        function savePublicReview(e) {
            e.preventDefault();
            const name = document.getElementById('publicReviewName').value.trim();
            const text = document.getElementById('publicReviewText').value.trim();

            if (name && text) {
                database.ref('reviews').push({ name: name, text: text, timestamp: Date.now() }, (error) => {
                    if (!error) {
                        document.getElementById('publicReviewForm').reset();
                        alert("تم نشر تقييمك بنجاح!");
                    }
                });
            }
        }

        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

        function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    if (userCredential.user.email !== ADMIN_EMAIL) {
                        alert("عفواً، هذا الحساب لا يملك صلاحيات الإشراف!");
                        auth.signOut();
                        return;
                    }
                    closeLoginModal();
                    alert("تم تسجيل الدخول بنجاح.");
                })
                .catch((error) => {
                    alert("خطأ في تسجيل الدخول: البريد أو كلمة المرور غير صحيحة.");
                });
        }

        function logoutAdmin() {
            auth.signOut().then(() => alert("تم تسجيل الخروج."));
        }

        function scrollToReviews() {
            document.getElementById('reviewsSection').scrollIntoView({ behavior: 'smooth' });
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }

        listenToReviews();
    </script>
</body>
</html>
